package:
  name: js-bigints
  dependencies:
    - integers
    - maybe
    - prelude
  test:
    main: Test.Main
    dependencies:
      - assert
      - console
      - effect

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output]
  packageSet:
    registry: 77.10.1
  extraPackages:
    assert:
      path: ../purust-assert
    console:
      path: ../purust-console
    effect:
      path: ../purust-effect
    functions:
      path: ../purust-functions
    integers:
      path: ../purust-integers
    numbers:
      path: ../purust-numbers
    prelude:
      path: ../purust-prelude
    unsafe-coerce:
      path: ../purust-unsafe-coerce
